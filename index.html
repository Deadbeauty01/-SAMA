<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>互动地图 | 剧情攻略</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0b0d17;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #1a1e2b;
      cursor: grab;
    }
    .map-viewport:active {
      cursor: grabbing;
    }
    .coord-display {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #ffbb2e;
      padding: 8px 15px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      z-index: 100;
      pointer-events: none;
      border: 1px solid #ffbb2e;
    }
    .map-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1024px;
      height: 1024px;
      transform-origin: 0 0;
      will-change: transform;
      backface-visibility: hidden;
      background-image: url('Images/background.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }
    .map-container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      transition: filter 0.2s, opacity 0.3s;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }
    .marker:hover {
      filter: drop-shadow(0 0 10px #ffbb2e) brightness(1.3);
      z-index: 20;
    }
    .marker-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: all 0.2s;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .marker-icon.cat-task-props { background: rgba(255, 107, 53, 0.85); }
    .marker-icon.cat-task-locations { background: rgba(72, 187, 120, 0.85); }
    .marker-icon.cat-armory { background: rgba(237, 100, 166, 0.85); width: 28px; height: 28px; }
    .marker-icon.cat-armory img { width: 70%; height: 70%; object-fit: contain; }
    .marker-icon.cat-workbench { background: rgba(99, 179, 237, 0.85); width: 28px; height: 28px; }
    .marker-icon.cat-workbench img { width: 70%; height: 70%; object-fit: contain; }
    .marker-icon.cat-fishing-rod { background: rgba(129, 230, 217, 0.85); }
    .marker-icon.cat-fishing-spot { background: rgba(69, 104, 220, 0.85); }
    .marker-icon.cat-container { background: rgba(177, 140, 242, 0.85); }
    .marker-icon.cat-wall-weapon { background: rgba(247, 194, 54, 0.55); width: 24px; height: 24px; font-size: 12px; border-width: 1.5px; }
    .marker.hidden-marker {
      opacity: 0;
      pointer-events: none;
    }
    
    .marker.visible-marker {
      animation: pulse 1s ease-in-out 3;
    }
    
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(255, 187, 46, 0.7); }
      50% { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 0 10px rgba(255, 187, 46, 0); }
    }

    .sidebar {
      width: 400px;
      background: rgba(18, 22, 33, 0.95);
      backdrop-filter: blur(15px);
      border-left: 1px solid #2a3142;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: -5px 0 20px rgba(0,0,0,0.5);
      z-index: 30;
      scrollbar-width: thin;
      scrollbar-color: #3a4155 #1a1e2b;
      position: relative;
    }
    .watermark {
      position: absolute;
      top: 10px;
      right: 15px;
      color: rgba(255, 187, 46, 0.5);
      font-size: 12px;
      font-weight: bold;
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }
    .sidebar::-webkit-scrollbar {
      width: 8px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: #1a1e2b;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: #3a4155;
      border-radius: 4px;
    }

    .sidebar-section {
      padding: 18px 20px;
      border-bottom: 1px solid #2a3142;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #ccd6f6;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .key-points-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .key-point-item {
      background: #1e2332;
      border-left: 3px solid #ffbb2e;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e0;
    }
    .key-point-item .kp-title {
      font-weight: 700;
      color: #ffbb2e;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .key-point-item .kp-content {
      color: #b0bec5;
      font-size: 12px;
    }

    .tag-tree {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tag-category {
      margin-bottom: 0;
    }
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #232838;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #b0bec5;
      transition: all 0.2s;
      font-size: 14px;
      border: 1px solid transparent;
    }
    .category-header:hover {
      background: #2f364b;
      color: #e0e0e0;
    }
    .category-header.active {
      background: #2a3a5e;
      color: #ffbb2e;
      border-color: #ffbb2e;
    }
    .arrow {
      font-size: 12px;
      transition: transform 0.2s;
      color: #6b7a90;
    }
    .category-header.expanded .arrow {
      transform: rotate(90deg);
    }
    .category-header.no-expand .arrow {
      display: none;
    }
    .subcategory-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s, opacity 0.3s;
      opacity: 0;
    }
    .subcategory-list.show {
      max-height: 600px;
      padding: 10px 0 10px 20px;
      opacity: 1;
    }
    .sub-tag {
      padding: 5px 12px;
      background: #1e2332;
      border: 1px solid #3a4155;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      color: #b0bec5;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .sub-tag:hover {
      background: #2a3142;
      color: white;
    }
    .sub-tag.active {
      background: #ffbb2e;
      color: #0b0d17;
      border-color: #ffbb2e;
      font-weight: 700;
    }
    .select-all-btn {
      background: linear-gradient(135deg, #2a3a5e, #1e2a3a);
      border: 2px solid #ffbb2e;
      color: #ffbb2e;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      transition: all 0.2s;
      width: 100%;
    }
    .select-all-btn:hover {
      background: linear-gradient(135deg, #3a4a6e, #2a3a4a);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 187, 46, 0.2);
    }
    .select-all-btn.active {
      background: #ffbb2e;
      color: #0b0d17;
      border-color: #ffbb2e;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #4a5568;
      color: #a0aec0;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 14px;
      transition: all 0.2s;
      width: 100%;
    }
    .reset-btn:hover {
      background: #2d3748;
      color: white;
      border-color: #718096;
    }

    .flowchart-container {
      position: relative;
      padding: 10px 0;
    }
    .flow-node {
      display: flex;
      align-items: flex-start;
      margin-bottom: 20px;
      position: relative;
    }
    .flow-circle {
      width: 48px;
      height: 48px;
      background: #2a3a5e;
      border: 2px solid #ffbb2e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #ffbb2e;
      font-size: 16px;
      flex-shrink: 0;
      z-index: 2;
    }
    .flow-content {
      margin-left: 16px;
      flex: 1;
      background: #1e2332;
      border: 1px solid #3a4155;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .flow-title {
      font-weight: 800;
      color: #ffbb2e;
      font-size: 15px;
      margin-bottom: 10px;
    }
    .flow-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .flow-item {
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e0;
      padding-left: 18px;
      position: relative;
    }
    .flow-item::before {
      content: "•";
      color: #ffbb2e;
      font-weight: bold;
      position: absolute;
      left: 0;
    }
    .flow-arrow {
      position: absolute;
      left: 23px;
      top: 48px;
      width: 2px;
      height: calc(100% + 10px);
      background: linear-gradient(180deg, #ffbb2e, #3a4155);
    }
    .flow-subtitle {
      font-size: 12px;
      color: #a0aec0;
      margin: 8px 0 4px 0;
      padding-left: 18px;
    }
    .flow-parallel {
      background: rgba(255, 187, 46, 0.1);
      border-left: 3px solid #ffbb2e;
      padding: 10px 14px;
      border-radius: 6px;
      margin: 8px 0;
    }
    .flow-parallel-title {
      font-size: 12px;
      color: #ffbb2e;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .flow-branch {
      display: flex;
      gap: 10px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .flow-branch-item {
      flex: 1;
      min-width: 160px;
      background: #1a1e2b;
      border: 1px dashed #3a4155;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .flow-branch-title {
      font-size: 12px;
      color: #a0aec0;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .flow-branch-content {
      font-size: 12px;
      color: #cbd5e0;
      line-height: 1.5;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      transition: all 0.25s;
    }
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-content {
      background: #1a1f2e;
      border: 1px solid #3a4155;
      border-radius: 16px;
      padding: 24px;
      max-width: 700px;
      width: 90%;
      color: #ddd;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: #8892b0;
      font-size: 28px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .modal-close:hover {
      color: #ffbb2e;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #ffbb2e;
      text-align: center;
    }

    /* 手机适配样式 */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: 100vh;
      }

      .map-viewport {
        flex: 1;
        min-height: 50vh;
        padding-bottom: 60px;
      }

      .sidebar {
        width: 100%;
        position: fixed;
        bottom: 60px;
        left: 0;
        right: 0;
        height: 0;
        max-height: calc(70vh - 60px);
        overflow-y: auto;
        border-left: none;
        border-top: 1px solid #3a4155;
        transition: height 0.3s ease;
        z-index: 50;
      }

      .sidebar.active {
        height: calc(70vh - 60px);
      }

      .bottom-nav {
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: #1a1f2e;
        border-top: 1px solid #3a4155;
        padding: 8px 0;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 60;
        height: 60px;
      }

      .nav-btn {
        background: none;
        border: none;
        color: #a0aec0;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: color 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .nav-btn.active {
        color: #ffbb2e;
      }

      .nav-icon {
        font-size: 22px;
      }

      .coord-display {
        font-size: 12px;
        padding: 6px 12px;
        bottom: 75px;
      }

      .sidebar-section {
        padding: 12px 16px;
      }

      .section-title {
        font-size: 15px;
      }

      .marker-icon {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .marker-icon.cat-wall-weapon {
        width: 22px;
        height: 22px;
        font-size: 11px;
      }

      .flow-circle {
        width: 40px;
        height: 40px;
        font-size: 14px;
      }

      .flow-title {
        font-size: 14px;
      }

      .flow-item {
        font-size: 12px;
      }

      .modal-content {
        padding: 16px;
        width: 95%;
        max-height: 85vh;
        overflow-y: auto;
      }

      .watermark {
        top: 8px;
        right: 12px;
        font-size: 11px;
      }

      .select-all-btn {
        font-size: 13px;
        padding: 8px 14px;
      }

      .category-header {
        padding: 8px 12px;
        font-size: 13px;
      }

      .sub-tag {
        padding: 4px 10px;
        font-size: 11px;
      }

      .key-point-item {
        padding: 10px 12px;
      }

      .kp-title {
        font-size: 12px;
      }

      .kp-content {
        font-size: 11px;
      }
    }

    @media (min-width: 769px) {
      .bottom-nav {
        display: none;
      }
    }

    .bottom-nav {
      display: none;
    }
  </style>
</head>
<body>
  <div class="map-viewport" id="mapViewport">
    <div class="map-container" id="mapContainer"></div>
    <div class="coord-display" id="coordDisplay">坐标: (0, 0)</div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="watermark">B站可许sama制作</div>
    <div class="sidebar-section">
      <div class="section-title">🏷️ 地图筛选</div>
      <button class="select-all-btn" id="selectAllBtn">✓ 全选显示所有图标</button>
      <div class="tag-tree" id="tagTree"></div>
      <button class="reset-btn" id="resetFilterBtn">↺ 重置所有筛选</button>
    </div>
    <div class="sidebar-section">
      <div class="section-title">📜 剧情攻略流程</div>
      <div class="flowchart-container" id="flowchart"></div>
    </div>
    <div class="sidebar-section">
      <div class="section-title">💡 要点</div>
      <div class="key-points-list" id="keyPoints"></div>
    </div>
  </div>

  <!-- 手机底部导航栏 -->
  <div class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" id="navMap">
      <span class="nav-icon">🗺️</span>
      <span>地图</span>
    </button>
    <button class="nav-btn" id="navFilter">
      <span class="nav-icon">🏷️</span>
      <span>筛选</span>
    </button>
    <button class="nav-btn" id="navFlow">
      <span class="nav-icon">📜</span>
      <span>攻略</span>
    </button>
    <button class="nav-btn" id="navTips">
      <span class="nav-icon">💡</span>
      <span>要点</span>
    </button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    (function() {
      const MAP_WIDTH = 1024;
      const MAP_HEIGHT = 1024;
      let currentZoom = 1;
      let panX = 0, panY = 0;
      let isPanning = false;
      let startMouseX, startMouseY, startPanX, startPanY;

      const mapViewport = document.getElementById('mapViewport');
      const mapContainer = document.getElementById('mapContainer');
      const tagTreeDiv = document.getElementById('tagTree');
      const flowchartDiv = document.getElementById('flowchart');
      const keyPointsDiv = document.getElementById('keyPoints');
      const coordDisplay = document.getElementById('coordDisplay');
      const resetBtn = document.getElementById('resetFilterBtn');
      const selectAllBtn = document.getElementById('selectAllBtn');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalClose = document.getElementById('modalClose');
      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');

      let selectAllMode = false;

      function applyTransform() {
        mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
      }

      mapViewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = mapViewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const zoomFactor = 0.08;
        const delta = e.deltaY > 0 ? -zoomFactor : zoomFactor;
        const newZoom = Math.min(3.5, Math.max(0.3, currentZoom + delta * currentZoom));
        const scaleChange = newZoom / currentZoom;
        panX = mouseX - (mouseX - panX) * scaleChange;
        panY = mouseY - (mouseY - panY) * scaleChange;
        currentZoom = newZoom;
        applyTransform();
      }, { passive: false });

      mapViewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.marker')) return;
        isPanning = true;
        startMouseX = e.clientX;
        startMouseY = e.clientY;
        startPanX = panX;
        startPanY = panY;
        mapViewport.style.cursor = 'grabbing';
      });

      mapViewport.addEventListener('mousemove', (e) => {
        const rect = mapViewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const mapX = (mouseX - panX) / currentZoom;
        const mapY = (mouseY - panY) / currentZoom;

        const x = Math.max(0, Math.min(MAP_WIDTH, Math.round(mapX)));
        const y = Math.max(0, Math.min(MAP_HEIGHT, Math.round(mapY)));

        coordDisplay.textContent = `坐标: (${x}, ${y})`;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = startPanX + (e.clientX - startMouseX);
        panY = startPanY + (e.clientY - startMouseY);
        applyTransform();
      });

      window.addEventListener('mouseup', () => {
        if (isPanning) {
          isPanning = false;
          mapViewport.style.cursor = 'grab';
        }
      });

      let lastTouchX, lastTouchY, lastTouchDist;

      mapViewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isPanning = true;
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
          startPanX = panX;
          startPanY = panY;
        } else if (e.touches.length === 2) {
          isPanning = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          lastTouchDist = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: false });

      mapViewport.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && isPanning) {
          const dx = e.touches[0].clientX - lastTouchX;
          const dy = e.touches[0].clientY - lastTouchY;
          panX = startPanX + dx;
          panY = startPanY + dy;
          applyTransform();
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const scale = dist / lastTouchDist;
          currentZoom = Math.min(3.5, Math.max(0.3, currentZoom * scale));
          lastTouchDist = dist;
          applyTransform();
        }
      }, { passive: false });

      mapViewport.addEventListener('touchend', () => {
        isPanning = false;
      });

      applyTransform();

      const categories = [
        {
          id: 'task-props', name: '任务道具', expandable: true,
          children: ['铁链','罐头','信号器','撬棍','碎肉','奇迹弹幕']
        },

      let activeFilters = new Set();

      function createMarkerElement(markerData) {
        const div = document.createElement('div');
        div.className = 'marker';
        div.dataset.markerId = markerData.id;
        div.style.left = markerData.x + 'px';
        div.style.top = markerData.y + 'px';
        const iconDiv = document.createElement('div');
        const catClass = markerData.catClass || 'cat-task-props';
        iconDiv.className = 'marker-icon ' + catClass;
        if (markerData.detail && markerData.detail.src && (catClass === 'cat-armory' || catClass === 'cat-workbench')) {
          const img = document.createElement('img');
          img.src = markerData.detail.src;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'contain';
          iconDiv.appendChild(img);
        } else {
          iconDiv.textContent = markerData.icon || '';
        }
        div.appendChild(iconDiv);
        div.addEventListener('click', (e) => {
          if (catClass === 'cat-armory' || catClass === 'cat-workbench') {
            return;
          }
          e.stopPropagation();
          showMarkerDetail(markerData);
        });
        return div;
      }

      markersData.forEach(md => {
        const el = createMarkerElement(md);
        mapContainer.appendChild(el);
      });

      let previousVisibleIds = new Set();
      
      function updateMarkerVisibility() {
        const markers = document.querySelectorAll('.marker');
        const newlyVisibleMarkers = [];
        const currentVisibleIds = new Set();
        
        markers.forEach(markerEl => {
          const id = markerEl.dataset.markerId;
          const data = markersData.find(m => m.id === id);
          if (!data) return;
          markerEl.classList.remove('visible-marker');
          
          if (selectAllMode) {
            markerEl.classList.remove('hidden-marker');
            currentVisibleIds.add(id);
            if (!previousVisibleIds.has(id)) {
              newlyVisibleMarkers.push(data);
            }
            return;
          }
          if (activeFilters.size === 0) {
            markerEl.classList.add('hidden-marker');
            return;
          }
          const isVisible = data.tags.some(tag => activeFilters.has(tag));
          markerEl.classList.toggle('hidden-marker', !isVisible);
          if (isVisible) {
            currentVisibleIds.add(id);
            if (!previousVisibleIds.has(id)) {
              newlyVisibleMarkers.push(data);
            }
          }
        });
        
        previousVisibleIds = currentVisibleIds;
        
        if (newlyVisibleMarkers.length > 0) {
          fitMapToMarkers(newlyVisibleMarkers);
          setTimeout(() => {
            newlyVisibleMarkers.forEach(m => {
              const markerEl = document.querySelector(`.marker[data-marker-id="${m.id}"]`);
              if (markerEl) {
                markerEl.classList.add('visible-marker');
              }
            });
          }, 300);
        }
      }
      
      function fitMapToMarkers(markers) {
        if (markers.length === 0) return;
        
        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        
        markers.forEach(m => {
          minX = Math.min(minX, m.x);
          maxX = Math.max(maxX, m.x);
          minY = Math.min(minY, m.y);
          maxY = Math.max(maxY, m.y);
        });
        
        const padding = 80;
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        const width = maxX - minX + padding * 2;
        const height = maxY - minY + padding * 2;
        
        const rect = mapViewport.getBoundingClientRect();
        const scaleX = rect.width / width;
        const scaleY = rect.height / height;
        const newZoom = Math.min(scaleX, scaleY, 2);
        
        currentZoom = newZoom;
        panX = rect.width / 2 - centerX * newZoom;
        panY = rect.height / 2 - centerY * newZoom;
        applyTransform();
      }

        window.isFullscreen = false;
        window.imageZoom = 1;
        
        window.toggleFullscreen = function() {

          const controls = document.getElementById('fullscreenControls');
          if (window.isFullscreen) {

            container.style.height = '100vh';

          } else {
            container.style.position = 'relative';

            container.style.borderRadius = '10px';
            img.style.maxWidth = '100%';
            img.style.maxHeight = 'none';
            img.style.objectFit = 'contain';
            img.style.cursor = 'zoom-in';
            img.style.transform = 'scale(1)';
            window.imageZoom = 1;
            if (controls) controls.style.display = 'none';
          }
        };
        
        const img = document.getElementById('detailImage');
        const container = document.getElementById('detailImageContainer');
        if (img) {
          img.addEventListener('click', window.toggleFullscreen);
          img.addEventListener('wheel', function(e) {
            if (!window.isFullscreen) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.2 : 0.2;
            window.imageZoom = Math.max(0.5, Math.min(5, window.imageZoom + delta));
            img.style.transform = `scale(${window.imageZoom})`;
          }, { passive: false });
        }
        
        modalOverlay.classList.add('active');

            selectAllBtn.style.color = '#ffbb2e';
            selectAllBtn.style.borderRadius = '6px';
            selectAllBtn.style.cursor = 'pointer';
            selectAllBtn.style.fontSize = '12px';
            selectAllBtn.style.fontWeight = 'bold';
            selectAllBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              const allChildTags = [];
              for (let i = 0; i < cat.children.length; i++) {
                allChildTags.push(`${cat.id}/${cat.children[i]}`);
              }
              const allActive = allChildTags.every(t => activeFilters.has(t));
              if (allActive) {
                allChildTags.forEach(t => activeFilters.delete(t));
                selectAllBtn.textContent = '全选';
                selectAllBtn.style.background = '#2a3a5e';
                selectAllBtn.style.color = '#ffbb2e';
              } else {
                allChildTags.forEach(t => activeFilters.add(t));
                selectAllBtn.textContent = '取消全选';
                selectAllBtn.style.background = '#ffbb2e';
                selectAllBtn.style.color = '#0b0d17';
              }
              updateUIAfterFilterChange();
            });
            subList.appendChild(selectAllBtn);
            
            cat.children.forEach((childName, idx) => {
              const subTag = document.createElement('span');
              subTag.className = 'sub-tag';
              subTag.textContent = childName;
              const tagValue = `${cat.id}/${childName}`;
              subTag.dataset.tag = tagValue;
              subTag.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFilterTag(tagValue, subTag);
                const allChildTags = [];
                for (let i = 0; i < cat.children.length; i++) {
                  allChildTags.push(`${cat.id}/${cat.children[i]}`);
                }
                const allActive = allChildTags.every(t => activeFilters.has(t));
                if (allActive) {
                  selectAllBtn.textContent = '取消全选';
                  selectAllBtn.style.background = '#ffbb2e';
                  selectAllBtn.style.color = '#0b0d17';
                } else {
                  selectAllBtn.textContent = '全选';
                  selectAllBtn.style.background = '#2a3a5e';
                  selectAllBtn.style.color = '#ffbb2e';
                }
              });
              subList.appendChild(subTag);
            });
          } else if (cat.expandable && cat.children.length === 0) {
            const emptySpan = document.createElement('span');
            emptySpan.className = 'sub-tag';
            emptySpan.textContent = '暂无';
            emptySpan.style.opacity = '0.5';
            emptySpan.style.pointerEvents = 'none';
            subList.appendChild(emptySpan);
          }
          
          header.addEventListener('click', (e) => {
            e.stopPropagation();
            
            if (cat.expandable) {
              const isExpanded = header.classList.contains('expanded');
              if (!isExpanded) {
                header.classList.add('expanded');
                subList.classList.add('show');
              } else {
                header.classList.remove('expanded');
                subList.classList.remove('show');
              }
            }
            
            if (!cat.expandable) {
              const allChildTags = [];
              for (let i = 0; i < cat.children.length; i++) {
                allChildTags.push(`${cat.id}/${cat.children[i]}`);
              }
              
              const allActive = allChildTags.every(t => activeFilters.has(t));
              if (allActive) {
                allChildTags.forEach(t => activeFilters.delete(t));
              } else {
                allChildTags.forEach(t => activeFilters.add(t));
              }
              updateUIAfterFilterChange();
            }
          });
          
          catDiv.appendChild(header);
          if (cat.expandable) {
            catDiv.appendChild(subList);
          }
          tagTreeDiv.appendChild(catDiv);
        });
      }

      function toggleFilterTag(tagValue, element) {
        if (activeFilters.has(tagValue)) {
          activeFilters.delete(tagValue);
        } else {
          activeFilters.add(tagValue);
        }
        updateUIAfterFilterChange();
      }

      function updateUIAfterFilterChange() {
        document.querySelectorAll('.sub-tag').forEach(el => {
          const tag = el.dataset.tag;
          if (tag && activeFilters.has(tag)) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        });
        
        document.querySelectorAll('.category-header').forEach(header => {
          const catDiv = header.parentElement;
          const cat = categories.find(c => c.name === header.querySelector('span').textContent);
          let allChildTags = [];
          if (cat) {
            for (let i = 0; i < cat.children.length; i++) {
              allChildTags.push(`${cat.id}/${cat.children[i]}`);
            }
          }
          const allActive = allChildTags.length > 0 && allChildTags.every(t => activeFilters.has(t));
          if (allActive && activeFilters.size > 0) {
            header.classList.add('active');
          } else {
            header.classList.remove('active');
          }
        });
        
        updateMarkerVisibility();
      }

      resetBtn.addEventListener('click', () => {
        activeFilters.clear();
        selectAllMode = false;
        selectAllBtn.classList.remove('active');
        updateUIAfterFilterChange();
        resetMapView();
      });

      selectAllBtn.addEventListener('click', () => {
        selectAllMode = !selectAllMode;
        selectAllBtn.classList.toggle('active', selectAllMode);
        if (selectAllMode) {
          activeFilters.clear();
          document.querySelectorAll('.sub-tag').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.category-header').forEach(el => el.classList.remove('active'));
        }
        updateMarkerVisibility();
      });

      function resetMapView() {
        const rect = mapViewport.getBoundingClientRect();
        const scaleX = rect.width / MAP_WIDTH;
        const scaleY = rect.height / MAP_HEIGHT;
        currentZoom = Math.min(scaleX, scaleY, 1);
        panX = (rect.width - MAP_WIDTH * currentZoom) / 2;
        panY = (rect.height - MAP_HEIGHT * currentZoom) / 2;
        applyTransform();
      }

      function buildFlowchart() {
        const steps = [
          {
            num: '1',
            title: '第一步：解锁 PAP',
            items: ['解锁 PAP']
          },
          {
            num: '2',
            title: '第二步：收集基础道具',
            items: ['拿到铁链', '拿到罐头', '放置灯笼', '获取撬棍', '获得奇迹武器']
          },
          {
            num: '3',
            title: '第三步：完成灯塔岛任务 & 获取奇迹弹幕',
            items: [
              '开箱子拿到炮弹 → 前往灯塔岛放置炮弹 → 用奇迹武器近战攻击',
              '搜索信号器 → 前往索尔头部放置信号器',
              '前往信号塔输入两次信号 → 获得奇迹弹幕 → 打开娃娃机的门'
            ]
          },
          {
            num: '4',
            title: '第四步：收集三个铀',
            items: ['💡 这一步可与第二步同步进行，且三个铀没有固定顺序'],
            branches: [
              { label: '方式一', content: '用小车炸开实验室 → 获取铀' },
              { label: '方式二', content: '钓绿色鱼 → 杀死特殊劫掠者 → 获取铀' },
              { label: '方式三', content: '杀死20个被反重力钟举起的僵尸 → 获取铀' }
            ],
            parallel: true
          },
          {
            num: '5',
            title: '第五步：制作太阳石',
            items: [
              '抓娃娃获得原子能核心',
              '前往快速复苏附近充能',
              '前往风暴大桥放置核心',
              '前往泰尔脚附近拿到碎肉',
              '前往碎肉广场 → 用奇迹武器点燃篝火 → 放置碎肉',
              '变身门徒进行烤肉 → 获得太阳石'
            ]
          },
          {
            num: '6',
            title: '第六步：最终决战',
            items: [
              '将太阳石放到教堂',
              '按照从简单到复杂的顺序（跟随箭头指引），用奇迹武器依次点燃地图上的符号',
              '进入 Boss 战'
            ]
          }
        ];

        flowchartDiv.innerHTML = '';
        steps.forEach((step, index) => {
          const stepDiv = document.createElement('div');
          stepDiv.className = 'flow-node';
          
          let itemsHtml = '';
          if (step.items) {
            itemsHtml = '<div class="flow-items">';
            step.items.forEach(item => {
              itemsHtml += `<div class="flow-item">${item}</div>`;
            });
            itemsHtml += '</div>';
          }
          
          let branchesHtml = '';
          if (step.branches && step.branches.length > 0) {
            branchesHtml = '<div class="flow-branch">';
            step.branches.forEach(branch => {
              branchesHtml += `<div class="flow-branch-item">`;
              if (branch.label) {
                branchesHtml += `<div class="flow-branch-title">${branch.label}</div>`;
              }
              branchesHtml += `<div class="flow-branch-content">${branch.content}</div></div>`;
            });
            branchesHtml += '</div>';
          }
          
          stepDiv.innerHTML = `
            <div class="flow-circle">${step.num}</div>
            <div class="flow-content">
              <div class="flow-title">${step.title}</div>
              ${itemsHtml}
              ${branchesHtml}
            </div>
            ${index < steps.length - 1 ? '<div class="flow-arrow"></div>' : ''}
          `;
          flowchartDiv.appendChild(stepDiv);
        });
      }

      function buildKeyPoints() {
        const points = [
          { title: '开局提示', content: '广场那边开局就有 ARC 小车拿，用来开实验室门。' },
          { title: '铀的拿取', content: '铀的拿取不限回合、不限前置。' },
          { title: '武器推荐', content: 'BOSS 战双持冲锋枪最好用，因为这个 BOSS 对于伤害距离衰减微乎其微，不管是打真身还是打悬浮头（可以一次秒）。' },
          { title: '悬浮头打法', content: '悬浮头可以不止用奇迹武器，还能用投掷物。最佳用法是战争机器两发打下来（相比投掷物，备弹多）。' },
          { title: 'BOSS 躲避技巧', content: '在 BOSS 触发冻结范围前先躲避龟波气功，随后去到中心开启陷阱，然后参照最后一阶段躲陨石进行攻击即可。' },
          { title: '陨石注意事项', content: '如果一味地躲石头后面来躲避陨石，不仅甲会全碎（陨石有溅射伤害），还容易被冰冻的持续伤害打的不知所措，还没良好的输出空间。' }
        ];
        keyPointsDiv.innerHTML = '';
        points.forEach(point => {
          const item = document.createElement('div');
          item.className = 'key-point-item';
          item.innerHTML = `<div class="kp-title">${point.title}</div><div class="kp-content">${point.content}</div>`;
          keyPointsDiv.appendChild(item);
        });
      }

      buildTagTree();
      buildFlowchart();
      buildKeyPoints();
      updateMarkerVisibility();
      resetMapView();

      // 手机端导航栏逻辑
      const bottomNav = document.getElementById('bottomNav');
      const navMap = document.getElementById('navMap');
      const navFilter = document.getElementById('navFilter');
      const navFlow = document.getElementById('navFlow');
      const navTips = document.getElementById('navTips');
      const sidebar = document.getElementById('sidebar');
      const sidebarSections = sidebar.querySelectorAll('.sidebar-section');

      function isMobile() {
        return window.innerWidth <= 768;
      }

      function setActiveNav(activeBtn) {
        [navMap, navFilter, navFlow, navTips].forEach(btn => btn.classList.remove('active'));
        activeBtn.classList.add('active');
      }

      function showSection(index) {
        if (!isMobile()) return;
        sidebar.classList.add('active');
        // 滚动到指定区域
        if (sidebarSections[index]) {
          sidebarSections[index].scrollIntoView({ behavior: 'smooth' });
        }
      }

      navMap.addEventListener('click', () => {
        setActiveNav(navMap);
        if (isMobile()) {
          sidebar.classList.remove('active');
        }
      });

      navFilter.addEventListener('click', () => {
        setActiveNav(navFilter);
        showSection(0);
      });

      navFlow.addEventListener('click', () => {
        setActiveNav(navFlow);
        showSection(1);
      });

      navTips.addEventListener('click', () => {
        setActiveNav(navTips);
        showSection(2);
      });

      // 窗口大小变化时处理
      window.addEventListener('resize', () => {
        resetMapView();
        if (!isMobile()) {
          sidebar.classList.remove('active');
        }
      });
    })();
  </script>
</body>
</html>
